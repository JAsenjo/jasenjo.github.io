<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Games Club · Support</title>
  <meta name="description" content="Legal and support links for Mini Games Club." />
  <link rel="stylesheet" href="legal/legal.css" />
  <style>
    .links {
      display: grid;
      gap: 12px;
      margin-top: 1.5rem;
    }
    .links a {
      display: block;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(47, 37, 63, 0.9);
      border: 1px solid rgba(210, 188, 255, 0.18);
      color: #fff3d6;
      text-decoration: none;
      font-weight: 700;
    }
    .links a:hover {
      border-color: rgba(0, 238, 253, 0.45);
    }
    .muted {
      color: #d0c6ac;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <img src="legal/app-icon.png" alt="" width="42" height="42" />
      </div>
      <div class="brand-text">Mini Games Club</div>
    </div>

    <header class="hero">
      <div class="badge">Support</div>
      <h1>Mini Games Club</h1>
      <p class="meta muted">
        Online mini-games with ranking · Android &amp; iOS<br />
        Contact:
        <a href="mailto:minigameschallenge@gmail.com">minigameschallenge@gmail.com</a>
      </p>
    </header>

    <section class="panel">
      <h2>Legal</h2>
      <div class="links">
        <a href="legal/privacy-policy.html">Privacy Policy</a>
        <a href="legal/terms-of-service.html">Terms of Service</a>
      </div>
    </section>
  </main>
</body>
</html>
